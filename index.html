<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bakkenbeheer</title>
<meta name="theme-color" content="#120b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bakkenbeheer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #120b1f;
    --card: #1e1433;
    --line: #34265a;
    --text: #fff;
    --muted: #b3a6d4;
    --beer: #ffd23f;
    --premium: #ff3d8b;
    --used: #2a2043;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-user-select: none; user-select: none;
    min-height: 100vh;
    background:
      radial-gradient(600px 300px at 10% -10%, rgba(255, 61, 139, .25), transparent 70%),
      radial-gradient(500px 300px at 110% 0%, rgba(123, 47, 247, .3), transparent 70%),
      var(--bg);
  }
  main { max-width: 520px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 34px; letter-spacing: -.5px; }
  .sub { color: var(--muted); margin-top: 4px; font-size: 15px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-title { font-size: 19px; font-weight: 700; }
  .card-hint { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .count { text-align: right; line-height: 1; }
  .count b { font-size: 46px; font-variant-numeric: tabular-nums; }
  .count span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .beer .count b { color: var(--beer); }
  .premium .count b { color: var(--premium); }

  .tokens { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 16px 0; }
  .premium .tokens { grid-template-columns: repeat(3, 1fr); }
  .token {
    aspect-ratio: 1;
    border-radius: 50%;
    border: 0;
    font-size: 24px;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .12s, background .2s, opacity .2s;
  }
  .premium .token { aspect-ratio: auto; height: 64px; border-radius: 16px; }
  .token:active { transform: scale(.9); }
  .beer .token { background: var(--beer); color: #000; }
  .premium .token { background: var(--premium); color: #fff; }
  .token.used { background: var(--used) !important; color: var(--muted); opacity: .7; }

  .use {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .use:active { transform: scale(.98); }
  .beer .use { background: var(--beer); color: #000; }
  .premium .use { background: var(--premium); color: #fff; }
  .use:disabled { background: var(--used) !important; color: var(--muted) !important; }

  .reset {
    display: block; margin: 24px auto 0;
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 10px 18px; font-size: 14px; cursor: pointer;
  }
  .install {
    background: rgba(255, 255, 255, .06); border: 1px dashed var(--line);
    border-radius: 16px; padding: 12px 14px; font-size: 14px; color: var(--muted);
    margin-bottom: 16px; line-height: 1.4;
  }
  .install b { color: var(--text); }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
    transform: translate(-50%, 140%);
    background: #fff; color: #000; border-radius: 999px;
    padding: 10px 10px 10px 18px; display: flex; align-items: center; gap: 12px;
    font-size: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    transition: transform .25s; max-width: calc(100% - 32px); white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button {
    border: 0; background: #000; color: #fff; border-radius: 999px;
    padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>🍻 Bakkenbeheer</h1>
    <div class="sub">528 Ibiza</div>
  </header>

  <div class="install" id="install" hidden>
    Tip: tik in Safari op <b>Deel</b> (vierkantje met pijl) en kies <b>Zet op beginscherm</b>. Dan staat Bakkenbeheer als app op je telefoon.
  </div>

  <div id="groups"></div>

  <button class="reset" id="reset">Alles terugzetten</button>
</main>

<div class="toast" id="toast"><span id="toast-text"></span><button id="undo">Herstel</button></div>

<script>
  const GROUPS = [
    { id: 'beer', title: 'Bier of water', hint: 'Gewone vouchers', icon: '🍺', total: 15 },
    { id: 'premium', title: 'Premium of soda', hint: 'Premium vouchers', icon: '🍸', total: 3 },
  ];
  const KEY = 'bakkenbeheer-v1';

  // Per groep: lijst met true (gebruikt) of false (nog over)
  let state = load();

  function fresh() {
    const s = {};
    GROUPS.forEach(g => { s[g.id] = Array(g.total).fill(false); });
    return s;
  }

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved && GROUPS.every(g => Array.isArray(saved[g.id]) && saved[g.id].length === g.total)) return saved;
    } catch (e) {}
    return fresh();
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function left(id) { return state[id].filter(used => !used).length; }

  function render() {
    const root = document.getElementById('groups');
    root.innerHTML = '';
    GROUPS.forEach(g => {
      const n = left(g.id);
      const card = document.createElement('section');
      card.className = 'card ' + g.id;
      card.innerHTML = `
        <div class="card-head">
          <div>
            <div class="card-title">${g.icon} ${g.title}</div>
            <div class="card-hint">${g.total - n} gebruikt</div>
          </div>
          <div class="count"><b>${n}</b><span>van ${g.total} over</span></div>
        </div>
        <div class="tokens"></div>
        <button class="use" ${n === 0 ? 'disabled' : ''}>${n === 0 ? 'Op! 😢' : 'Gebruik 1 voucher'}</button>`;

      const tokens = card.querySelector('.tokens');
      state[g.id].forEach((used, i) => {
        const t = document.createElement('button');
        t.className = 'token' + (used ? ' used' : '');
        t.textContent = used ? '✓' : g.icon;
        t.setAttribute('aria-label', `${g.title} voucher ${i + 1}, ${used ? 'gebruikt' : 'nog over'}`);
        t.onclick = () => toggle(g, i);
        tokens.appendChild(t);
      });

      card.querySelector('.use').onclick = () => {
        const i = state[g.id].indexOf(false);
        if (i !== -1) toggle(g, i);
      };
      root.appendChild(card);
    });
  }

  let undoTimer, lastChange;

  function toggle(g, i) {
    state[g.id][i] = !state[g.id][i];
    lastChange = { id: g.id, i };
    save();
    render();
    if (navigator.vibrate) navigator.vibrate(20);
    const n = left(g.id);
    showToast(state[g.id][i]
      ? `${g.icon} Voucher gebruikt, nog ${n} over`
      : `${g.icon} Voucher teruggezet, nog ${n} over`);
  }

  function showToast(text) {
    document.getElementById('toast-text').textContent = text;
    const t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => t.classList.remove('show'), 4000);
  }

  document.getElementById('undo').onclick = () => {
    if (!lastChange) return;
    const { id, i } = lastChange;
    state[id][i] = !state[id][i];
    lastChange = null;
    save();
    render();
    document.getElementById('toast').classList.remove('show');
  };

  document.getElementById('reset').onclick = () => {
    if (confirm('Alle vouchers weer op "nog over" zetten?')) {
      state = fresh();
      lastChange = null;
      save();
      render();
    }
  };

  // Laat de beginscherm-tip alleen zien in Safari, niet als de app al op het beginscherm staat
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    document.getElementById('install').hidden = false;
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  render();
</script>
</body>
</html>
